name: AIFRED Website Preview Dry-Run

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  preview-dryrun:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Run monorepo validator
        run: |
          chmod +x tools/release/aifred_monorepo_validate.sh
          ./tools/release/aifred_monorepo_validate.sh

      - name: Check website dry-run report
        run: python3 tools/release/aifred_website_dryrun_check.py --check

      - name: Check workflow audit report
        run: python3 tools/release/aifred_workflow_audit.py --check

      - name: Check apps website JavaScript syntax
        run: |
          node --check apps/website/app.js
          node --check apps/website/_worker.js
          node --check 'apps/website/functions/api/v1/[[path]].js'
          node --check 'apps/website/functions/api/[[path]].js'
          node --check apps/website/functions/ws/chat.js

      - name: Confirm read-only state
        run: |
          git status --short
          test -z "$(git status --short)"
