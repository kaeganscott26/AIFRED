name: Build AIFRED Beta

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vst3:
    name: VST3 Windows
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build, test, and package Beta
        shell: pwsh
        run: ./scripts/windows/build.ps1 -Action release

      - name: Upload validated Beta artifacts
        uses: actions/upload-artifact@v4
        with:
          name: AIFRED-VST3-windows
          path: |
            out/windows-x64/current/AIFRED-VST3-windows.zip
            out/windows-x64/current/installer/AIFRED-VST3-Setup.exe
            out/windows-x64/current/uninstaller/AIFRED-Uninstall.exe
          if-no-files-found: error

  release:
    name: Publish GitHub Beta release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [vst3]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --title "AIFRED Beta ${GITHUB_REF_NAME}" \
              --notes-file docs/RELEASE_NOTES.md
          fi
