name: Build AIFRED

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  vst3:
    name: VST3 ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows
            os: windows-latest
            package_platform: windows
          - name: macOS
            os: macos-15
            package_platform: macOS

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: "10.0.x"

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Windows build, test and validated release
        if: runner.os == 'Windows'
        shell: pwsh
        run: ./scripts/windows/build.ps1 -Action release

      - name: macOS candidate build and package
        if: runner.os == 'macOS'
        run: |
          sh scripts/macos/build.sh build
          sh scripts/macos/build.sh test
          sh tools/macos/package-aifred-macos.sh

      - name: Upload Windows release
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: AIFRED-VST3-windows
          path: |
            out/windows-x64/current/AIFRED-VST3-windows.zip
            out/windows-x64/current/installer/AIFRED-VST3-Setup.exe
            out/windows-x64/current/uninstaller/AIFRED-Uninstall.exe
          if-no-files-found: error

      - name: Upload macOS candidate
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: AIFRED-VST3-macOS
          path: out/macos-arm64/stage/AIFRED-VST3-macOS.pkg
          if-no-files-found: error

  website:
    name: Website checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install website tooling
        run: npm ci --prefix apps

      - name: JavaScript syntax
        run: npm --prefix apps run website:check

      - name: Guard active paths and product names
        shell: pwsh
        run: ./tools/check-no-hardcoded-paths.ps1

      - name: Analysis snapshot regression checks
        shell: pwsh
        run: ./tools/check-aifred-analysis-regressions.ps1

      - name: Monorepo validation
        run: bash tools/release/aifred_monorepo_validate.sh

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: [vst3, website]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          path: release-assets
          merge-multiple: true

      - name: Create or update release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            gh release upload "${GITHUB_REF_NAME}" release-assets/* --clobber
          else
            gh release create "${GITHUB_REF_NAME}" release-assets/* \
              --title "AIFRED ${GITHUB_REF_NAME}" \
              --notes-file apps/website/assets/docs/aifred-beta-release-notes.txt
          fi

  deploy-website:
    name: Deploy Cloudflare Pages
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    needs: [website]
    env:
      CLOUDFLARE_CREDENTIALS_PRESENT: ${{ secrets.CLOUDFLARE_API_TOKEN != '' && secrets.CLOUDFLARE_ACCOUNT_ID != '' }}
    steps:
      - uses: actions/checkout@v4

      - name: Skip when Cloudflare token is missing
        if: env.CLOUDFLARE_CREDENTIALS_PRESENT != 'true'
        run: echo "Set CLOUDFLARE_API_TOKEN and CLOUDFLARE_ACCOUNT_ID repository secrets to enable Cloudflare Pages deployment."

      - uses: actions/setup-node@v4
        if: env.CLOUDFLARE_CREDENTIALS_PRESENT == 'true'
        with:
          node-version: 22

      - name: Install pinned Wrangler
        if: env.CLOUDFLARE_CREDENTIALS_PRESENT == 'true'
        run: npm ci --prefix apps

      - name: Deploy to Cloudflare Pages
        if: env.CLOUDFLARE_CREDENTIALS_PRESENT == 'true'
        env:
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: npm --prefix apps run website:deploy
